name: Repository CI

on:
  push:
    branches:
      - branch-protection-test

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f data.csv
          echo "Required files are present"

      - name: Check CSV file
        run: |
          wc -l data.csv
          cat data.csv
          echo "CSV file validation completed"

  report:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Print result
        run: echo "Validation job completed successfully"
